<style>
body{margin:0;background:#0d1416}
html{color-scheme:dark}
*{scrollbar-color:#3a4f53 #111a1c}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:#111a1c}
::-webkit-scrollbar-thumb{background:#3a4f53;border-radius:999px;border:3px solid #111a1c}
::-webkit-scrollbar-thumb:hover{background:#4a6266}
::-webkit-scrollbar-corner{background:#111a1c}
a{color:#a5dcdd}a:hover{color:#d4f0f0}
.pcmt-loader{--radius:78px;--speed:2.4s;position:relative;width:calc(var(--radius)*2 + 60px);height:calc(var(--radius)*2 + 60px)}
.pcmt-loader span{position:absolute;left:50%;top:50%;width:34px;height:48px;margin:-24px 0 0 -17px;border-radius:5px;background:url("assets/38f3fa3227d68bf879b50c6927b7ab1f.png") center/90% no-repeat,#000;border:1.5px solid #a5dcdd;box-shadow:0 2px 6px rgba(0,0,0,.35);animation:pcmt-card-splay var(--speed) cubic-bezier(.65,0,.35,1) infinite;animation-delay:calc(var(--i)*0.035s)}
@keyframes pcmt-card-splay{0%,8%{transform:rotate(0deg) translateY(0)}40%,58%{transform:rotate(calc(var(--i)*24deg)) translateY(calc(var(--radius)*-1))}92%,100%{transform:rotate(360deg) translateY(0)}}
@media (prefers-reduced-motion: reduce){.pcmt-loader span{animation-duration:calc(var(--speed)*3)}}
.pcmt-loading{transition:opacity .4s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:#a5dcdd !important;box-shadow:0 0 0 3px rgba(165,220,221,.3)}
.st-card{position:relative;box-sizing:border-box;width:300px;zoom:.75;aspect-ratio:5/7;background:#172124;border:1px solid #2a3a3e;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 24px rgba(0,0,0,.55)}
.st-art{position:absolute;inset:0;z-index:0;pointer-events:none}
.st-art img.st-art-full{left:0;top:0;right:auto;bottom:auto;width:100%;height:100%;object-fit:cover;opacity:.32;-webkit-mask-image:radial-gradient(120% 90% at 55% 45%,#000 45%,transparent 100%);mask-image:radial-gradient(120% 90% at 55% 45%,#000 45%,transparent 100%)}
.st-art img.st-art-center{left:50%;top:50%;right:auto;bottom:auto;height:86%;width:auto;transform:translate(-50%,-46%);opacity:.24;-webkit-mask-image:none;mask-image:none}
.st-sheen{position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;background-size:260% 100%;background-repeat:no-repeat;animation:st-sheen 5s ease-in-out infinite}

.lib-stack{display:flex;flex-wrap:wrap;row-gap:30px;padding:26px 163px 8px 4px}
.lib-slot{position:relative;flex:none;width:225px;margin-right:-163px;transform:rotate(var(--r,0deg));transform-origin:50% 100%;transition:transform .22s ease,filter .22s ease;outline:none;cursor:pointer;filter:drop-shadow(-6px 0 10px rgba(0,0,0,.55))}
.lib-mvp{position:relative;background:#172124;border:1px solid #2a3a3e;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;transition:border-color .15s ease,box-shadow .15s ease}
.lib-mvp.is-over{border-color:#7cc2ff;box-shadow:0 0 0 3px rgba(124,194,255,.25),0 0 30px rgba(124,194,255,.18)}
.lib-mvp-row{display:flex;flex-wrap:wrap;gap:18px 16px;min-height:200px;padding:16px;border:1.5px dashed #3a4f53;border-radius:10px;align-items:flex-start}
.lib-mvp.is-over .lib-mvp-row{display:flex;flex-wrap:wrap;gap:18px 16px;min-height:200px;padding:16px;border:1.5px dashed #3a4f53;border-radius:10px;align-items:flex-start}
.lib-mvp-empty{margin:auto;align-self:center;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.06em;color:#93a9aa}
.lib-mvp-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
.lib-mvp-face{zoom:.72}
.lib-mvp-face .st-card{box-shadow:0 0 0 2px var(--ink),0 0 22px color-mix(in srgb,var(--ink) 40%,transparent)}
.lib-mvp-name{max-width:170px;font-family:'Cabin Sketch',cursive;font-weight:700;font-size:18px;line-height:1.1;color:var(--ink);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lib-mvp-x{position:absolute;top:-10px;right:-10px;z-index:3;width:30px;height:30px;border-radius:50%;border:1px solid #3a4f53;background:#172124;color:#eaf4f4;font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.lib-mvp-x:hover{border-color:#ff8a80;color:#ff8a80}.lib-mvp-x:focus-visible{outline:2px solid #a5dcdd;outline-offset:2px}
.lib-slot[data-rare="1"]{cursor:grab;-webkit-touch-callout:none}
.lib-slot img{-webkit-user-drag:none;user-select:none}
.lib-ghost{position:fixed;left:0;top:0;width:150px;z-index:2147483000;pointer-events:none;transform-origin:center;opacity:.92;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
.lib-ghost .st-card{transform:scale(.667);transform-origin:top left;width:225px}
body.lib-dragging,body.lib-dragging *{cursor:grabbing !important;user-select:none}
.lib-slot:last-child{margin-right:0}
.lib-slot:hover,.lib-slot:focus{z-index:200 !important;transform:translateY(-22px) rotate(0deg) scale(1.05);filter:drop-shadow(0 16px 22px rgba(0,0,0,.7))}
.lib-slot:focus-visible .st-card{box-shadow:0 0 0 3px #a5dcdd}
.lib-title{position:absolute;left:50%;top:-16px;z-index:4;max-width:200px;padding:5px 10px;border-radius:6px;border:1.5px solid var(--ink,#7cc2ff);background:#172124;color:#eaf4f4;font-family:'Cabin Sketch',cursive;font-weight:700;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;opacity:0;transform:translate(-50%,6px);transition:opacity .18s ease,transform .18s ease;box-shadow:0 0 12px var(--glow,rgba(124,194,255,.35)),0 4px 10px rgba(0,0,0,.6)}
.lib-slot:hover .lib-title,.lib-slot:focus .lib-title{opacity:1;transform:translate(-50%,0)}
.lib-count{position:absolute;left:-6px;top:-10px;z-index:3;padding:3px 8px;border-radius:6px;background:#a5dcdd;color:#000;font:600 11px/1 'JetBrains Mono',monospace;box-shadow:0 2px 6px rgba(0,0,0,.5)}
@media (max-width:520px){.lib-slot{margin-right:-170px}.lib-stack{flex-wrap:nowrap;overflow-x:auto;padding:46px 8px 14px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}.lib-slot{scroll-snap-align:start}}  /* phones: one stack per row that you swipe sideways */
@media (prefers-reduced-motion: reduce){.lib-slot,.lib-title{transition:none}}
@keyframes st-sheen{0%{background-position:160% 0}55%,100%{background-position:-60% 0}}
.st-stamp{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.14em;transform:rotate(-9deg);white-space:nowrap}
.st-shine{background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:st-shine 6s ease-in-out infinite}
@keyframes st-shine{0%{background-position:160% 0}50%,100%{background-position:-60% 0}}
@media (prefers-reduced-motion: reduce){.st-sheen,.st-shine{animation:none}}
.st-art img{position:absolute;right:-6%;bottom:-2%;height:104%;width:auto;max-width:none;opacity:.2;-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 100%);mask-image:linear-gradient(180deg,#000 55%,transparent 100%)}
.st-wm{position:absolute;inset:0;z-index:0;pointer-events:none;display:grid;place-items:center}
.st-wm img{width:78%;max-width:230px;aspect-ratio:1;object-fit:contain;opacity:.06;transform:translateY(10px)}
.st-body{box-sizing:border-box;position:relative;z-index:1;flex:1;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.st-stat{box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:40px;padding:6px 12px;border-radius:8px;background:rgba(0,0,0,.5)}
