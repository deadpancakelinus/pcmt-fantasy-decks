.pcmt-loader span{position:absolute;left:50%;top:50%;width:34px;height:48px;margin:-24px 0 0 -17px;border-radius:5px;background:url("assets/38f3fa3227d68bf879b50c6927b7ab1f.png") center/90% no-repeat,#000;border:1.5px solid #a5dcdd;box-shadow:0 2px 6px rgba(0,0,0,.35);animation:pcmt-card-splay var(--speed) cubic-bezier(.65,0,.35,1) infinite;animation-delay:calc(var(--i)*0.035s)}

@media (prefers-reduced-motion: reduce){.pcmt-loader span{animation-duration:calc(var(--speed)*3)}}
.pcmt-loading{transition:opacity .4s ease}

.st-art{position:absolute;inset:0;z-index:0;pointer-events:none}
.st-art img{position:absolute;right:-6%;bottom:-2%;height:104%;width:auto;max-width:none;opacity:.2;-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 100%);mask-image:linear-gradient(180deg,#000 55%,transparent 100%)}
.st-wm{position:absolute;inset:0;z-index:0;pointer-events:none;display:grid;place-items:center}
.st-wm img{width:78%;max-width:230px;aspect-ratio:1;object-fit:contain;opacity:.06;transform:translateY(10px)}
.st-body{box-sizing:border-box;position:relative;z-index:1;flex:1;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.st-stat{box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:40px;padding:6px 12px;border-radius:8px;background:rgba(0,0,0,.5)}
@media (max-width:520px){.st-card{aspect-ratio:auto;border-radius:10px}.st-body{padding:10px;gap:6px}.st-stat{min-height:34px;padding:5px 10px}}

<script type="text/plain" id="dc-logic">
// What's for sale. Stats match the player's MVP VS card (trumps-cards.js).
var PCMT_STORE_ITEMS = [
  { id: 'teklo-variant', title: 'Teklologik variant', blurb: 'teklo\'s MVP VS card with special art behind the card face.', price: '—',
    name: 'teklo', team: 'DFM', teamName: 'Dementia Found Me', color: '#5a78ff', season: 'S3 NA', maps: 21, role: 'duelist',
    teamLogo: 'assets/a59455af931db22aaf5f61e2da9f3686.png', regionLogo: 'assets/c265e976f8968e60e4a2bdd32542b499.png',
    roleIcon: 'assets/3911a104cbddaf481d7a7bf070a2e696.png', art: 'assets/8b1855340f56f72ea07f5447ca167038.webp',
    acs: 177, kast: 62, hs: 23, dpr: 0.83, toxic: 0.8 }
];
class Component extends DCLogic {
  componentDidMount() {
    var self = this, start = Date.now();
    if (this._pageDidMount) this._pageDidMount();
    this._navClick = function (e) {
      if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a || a.target === '_blank') return;
      var root = a.closest('[data-pcmt-root]');
      if (!root || root.getAttribute('data-pcmt-root') !== 'Store') return;
      if (!/\.html(#|$|\?)/.test(a.getAttribute('href'))) return;
      try { window.sessionStorage.setItem('pcmt-nav', String(Date.now())); } catch (err) {}
    };
    document.addEventListener('click', this._navClick, true);
    function imagesReady() {
      var imgs = Array.prototype.slice.call(document.images || []);
      return Promise.all(imgs.map(function (im) {
        return im.complete ? null : new Promise(function (res) { im.addEventListener('load', res, { once: true }); im.addEventListener('error', res, { once: true }); });
      }));
    }
    var fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    var cap = new Promise(function (res) { self._loaderCap = setTimeout(res, 5000); });
    Promise.race([Promise.all([fonts, imagesReady()]), cap]).then(function () {
      self._loaderMin = setTimeout(function () { self.hideLoader(); }, Math.max(0, 1200 - (Date.now() - start)));
    });
  }

  componentWillUnmount() {
    clearTimeout(this._loaderCap); clearTimeout(this._loaderMin); clearTimeout(this._loaderFade); clearTimeout(this._loaderBuf); clearTimeout(this._loaderNav); clearTimeout(this._navHide);
    if (this._navClick) document.removeEventListener('click', this._navClick, true);
    if (this._pageWillUnmount) this._pageWillUnmount();
  }

  showLoader(label) {
    clearTimeout(this._loaderFade);
    this.setState({ loaderPhase: 'on', loaderLabel: label || 'Loading' });
  }

  hideLoader() {
    var self = this;
    if ((this.state && this.state.loaderPhase) === 'gone') return;
    this.setState({ loaderPhase: 'fade' });
    clearTimeout(this._loaderFade);
    this._loaderFade = setTimeout(function () { self.setState({ loaderPhase: 'gone' }); }, 420);
  }

  bufferFor(label, ms, done) {
    var self = this;
    this.showLoader(label);
    clearTimeout(this._loaderBuf);
    this._loaderBuf = setTimeout(function () { if (done) done(); self.hideLoader(); }, ms);
  }

  renderVals() {
    if (this._arrived === undefined) {
      this._arrived = false;
      try {
        var t = Number(window.sessionStorage.getItem('pcmt-nav') || 0);
        if (t && Date.now() - t < 4000) { this._arrived = true; window.sessionStorage.removeItem('pcmt-nav'); }
      } catch (err) {}
    }
    var phase = (this.state && this.state.loaderPhase) || (this._arrived ? 'gone' : 'on');
    return Object.assign(this._pageVals(), {
      loaderOn: phase !== 'gone',
      loaderOpacity: phase === 'on' ? 1 : 0,
      loaderPointer: phase === 'on' ? 'auto' : 'none',
      loaderLabel: ((this.state && this.state.loaderLabel) || 'Loading').toUpperCase()
    });
  }

  _pageVals() {
    // Coming soon for everyone except admins (the live site sets PCMT_IS_ADMIN).
    var locked = !(typeof window !== 'undefined' && window.PCMT_IS_ADMIN);
    var items = PCMT_STORE_ITEMS.map(function (it) {
      return Object.assign({}, it, {
        nameSize: Math.max(18, Math.min(34, Math.floor(230 / Math.max(4, it.name.length * 0.62)))),
        roleLabel: it.role.charAt(0).toUpperCase() + it.role.slice(1),
        variantTag: 'VARIANT',
        cardLabel: it.title + ' card: ' + it.name + ', ' + it.teamName,
        stats: [
          { label: 'ACS', value: String(it.acs), low: false },
          { label: 'KAST', value: it.kast + '%', low: false },
          { label: 'HS%', value: it.hs + '%', low: false },
          { label: 'DPR', value: it.dpr.toFixed(2), low: true },
          { label: 'Toxic rating', value: it.toxic.toFixed(2), low: false }
        ]
      });
    });
    return {
      locked: locked,
      lockHidden: locked ? 'true' : 'false',
      lockBlur: locked ? 'blur(8px)' : 'none',
      lockPointer: locked ? 'none' : 'auto',
      items: items
    };
  }
}
