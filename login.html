<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { signedIn: false };
  }
  componentDidMount() {
    var self = this, start = Date.now();
    if (this._pageDidMount) this._pageDidMount();
    this._navClick = function (e) {
      if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a || a.target === '_blank') return;
      var root = a.closest('[data-pcmt-root]');
      if (!root || root.getAttribute('data-pcmt-root') !== 'Login') return;
      if (!/\.html(#|$|\?)/.test(a.getAttribute('href'))) return;
      try { window.sessionStorage.setItem('pcmt-nav', String(Date.now())); } catch (err) {}
    };
    document.addEventListener('click', this._navClick, true);
    function imagesReady() {
      var imgs = Array.prototype.slice.call(document.images || []);
      return Promise.all(imgs.map(function (im) {
        return im.complete ? null : new Promise(function (res) { im.addEventListener('load', res, { once: true }); im.addEventListener('error', res, { once: true }); });
      }));
    }
    var fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    var cap = new Promise(function (res) { self._loaderCap = setTimeout(res, 5000); });
    Promise.race([Promise.all([fonts, imagesReady()]), cap]).then(function () {
      self._loaderMin = setTimeout(function () { self.hideLoader(); }, Math.max(0, 1200 - (Date.now() - start)));
    });
  }

  componentWillUnmount() {
    clearTimeout(this._loaderCap); clearTimeout(this._loaderMin); clearTimeout(this._loaderFade); clearTimeout(this._loaderBuf); clearTimeout(this._loaderNav); clearTimeout(this._navHide);
    if (this._navClick) document.removeEventListener('click', this._navClick, true);
    if (this._pageWillUnmount) this._pageWillUnmount();
  }

  showLoader(label) {
    clearTimeout(this._loaderFade);
    this.setState({ loaderPhase: 'on', loaderLabel: label || 'Loading' });
  }

  hideLoader() {
    var self = this;
    if ((this.state && this.state.loaderPhase) === 'gone') return;
    this.setState({ loaderPhase: 'fade' });
    clearTimeout(this._loaderFade);
    this._loaderFade = setTimeout(function () { self.setState({ loaderPhase: 'gone' }); }, 420);
  }

  bufferFor(label, ms, done) {
    var self = this;
    this.showLoader(label);
    clearTimeout(this._loaderBuf);
    this._loaderBuf = setTimeout(function () { if (done) done(); self.hideLoader(); }, ms);
  }

  renderVals() {
    if (this._arrived === undefined) {
      this._arrived = false;
      try {
        var t = Number(window.sessionStorage.getItem('pcmt-nav') || 0);
        if (t && Date.now() - t < 4000) { this._arrived = true; window.sessionStorage.removeItem('pcmt-nav'); }
      } catch (err) {}
    }
    var phase = (this.state && this.state.loaderPhase) || (this._arrived ? 'gone' : 'on');
    return Object.assign(this._pageVals(), {
      loaderOn: phase !== 'gone',
      loaderOpacity: phase === 'on' ? 1 : 0,
      loaderPointer: phase === 'on' ? 'auto' : 'none',
      loaderLabel: ((this.state && this.state.loaderLabel) || 'Loading').toUpperCase()
    });
  }

  _pageVals() {
    var self = this;
    return {
      signedIn: this.state.signedIn,
      signedOut: !this.state.signedIn,
      signIn: function () { self.bufferFor('Connecting to Discord', 1600, function () { self.setState({ signedIn: true }); }); },
      signOut: function () { self.bufferFor('Logging out of Discord', 1000, function () { self.setState({ signedIn: false }); }); }
    };
  }
}
