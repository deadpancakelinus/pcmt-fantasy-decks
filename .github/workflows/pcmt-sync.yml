name: PCMT.gg sync

# Every 3 hours (and on demand from the Actions tab): pull matches, results and Pick'ems from PCMT.gg's API,
# refresh the MVP VS stats from pcmt.gg/stats, and push any changes to main (Cloudflare Pages redeploys the site).
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pcmt-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Matches, results and Pick'ems
        id: matches
        continue-on-error: true
        run: node tools/pcmt-sync.js --message "$RUNNER_TEMP/msg-matches.txt"

      - name: MVP VS stats
        id: stats
        continue-on-error: true
        run: |
          curl -sS --fail --max-time 60 https://pcmt.gg/stats -o "$RUNNER_TEMP/stats.html"
          node tools/pcmt-stats.js "$RUNNER_TEMP/stats.html" trumps/data/pcmt-stats.tsv
          if ! git diff --quiet -- trumps/data/pcmt-stats.tsv; then
            python3 -I trumps/build_cards.py
            node --check trumps-cards.js
            echo "MVP VS stats refresh" > "$RUNNER_TEMP/msg-stats.txt"
          fi

      - name: Commit and push
        run: |
          git add data.js pickems.js trumps/data/pcmt-stats.tsv trumps-cards.js
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          msg=$(cat "$RUNNER_TEMP"/msg-*.txt 2>/dev/null | paste -sd ';' - | sed 's/;/; /g')
          git -c user.name="deadpancakelinus" -c user.email="sixthneigh@gmail.com" commit -m "${msg:-PCMT.gg sync}"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

      - name: Report a failed step
        if: steps.matches.outcome == 'failure' || steps.stats.outcome == 'failure'
        run: |
          echo "matches: ${{ steps.matches.outcome }}, stats: ${{ steps.stats.outcome }}"
          exit 1
