name: PCMT.gg sync

# Every hour (and on demand from the Actions tab): pull matches, results and Pick'ems from PCMT.gg's API,
# refresh the Pick'ems team rosters from pcmt.gg/stats, make team card backs for each new season's teams (logos from their
# PCMT.gg team pages), rebuild the MVP VS decks (one per season) from pcmt.gg/stats and each season's matches, and push any
# changes to main (Cloudflare Pages redeploys the site).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pcmt-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Matches, results and Pick'ems
        id: matches
        continue-on-error: true
        run: node tools/pcmt-sync.js --message "$RUNNER_TEMP/msg-matches.txt"

      - name: Pick'ems team rosters
        id: rosters
        continue-on-error: true
        run: |
          if [ ! -s "$RUNNER_TEMP/stats.html" ]; then
            curl -sS --fail --max-time 60 --retry 4 --retry-delay 10 --retry-all-errors https://pcmt.gg/stats -o "$RUNNER_TEMP/stats.html"
          fi
          node tools/pcmt-rosters.js "$RUNNER_TEMP/stats.html" rosters.js
          node --check rosters.js
          node tools/pcmt-series.js series-stats.js
          node --check series-stats.js
          if ! git diff --quiet -- rosters.js series-stats.js; then echo "Team rosters" > "$RUNNER_TEMP/msg-rosters.txt"; fi

      - name: Team card backs
        id: teams
        continue-on-error: true
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install -q --user --break-system-packages pillow
          node tools/pcmt-teams.js
          node --check season-teams.js
          if ! git diff --quiet -- season-teams.js || [ -n "$(git status --porcelain -- assets/teams)" ]; then echo "Team card backs" > "$RUNNER_TEMP/msg-teams.txt"; fi

      - name: MVP VS decks
        id: stats
        continue-on-error: true
        run: |
          if [ ! -s "$RUNNER_TEMP/stats.html" ]; then
            curl -sS --fail --max-time 60 --retry 4 --retry-delay 10 --retry-all-errors https://pcmt.gg/stats -o "$RUNNER_TEMP/stats.html"
          fi
          node tools/mvp-vs-cards.js "$RUNNER_TEMP/stats.html"
          node --check trumps-cards.js
          if ! git diff --quiet -- trumps-cards.js; then echo "MVP VS decks" > "$RUNNER_TEMP/msg-stats.txt"; fi

      - name: Commit and push
        run: |
          git add data.js pickems.js rankings.js champions.js trumps-cards.js rosters.js series-stats.js season-teams.js
          git add -A assets/teams 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          msg=$(cat "$RUNNER_TEMP"/msg-*.txt 2>/dev/null | paste -sd ';' - | sed 's/;/; /g')
          git -c user.name="deadpancakelinus" -c user.email="sixthneigh@gmail.com" commit -m "${msg:-PCMT.gg sync}"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

      - name: Report a failed step
        if: steps.matches.outcome == 'failure' || steps.stats.outcome == 'failure' || steps.rosters.outcome == 'failure' || steps.teams.outcome == 'failure'
        run: |
          echo "matches: ${{ steps.matches.outcome }}, stats: ${{ steps.stats.outcome }}, rosters: ${{ steps.rosters.outcome }}, teams: ${{ steps.teams.outcome }}"
          exit 1
