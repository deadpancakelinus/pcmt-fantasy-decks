<style>
body{margin:0;background:#0d1416}
html{color-scheme:dark}
*{scrollbar-color:#3a4f53 #111a1c}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:#111a1c}
::-webkit-scrollbar-thumb{background:#3a4f53;border-radius:999px;border:3px solid #111a1c}
::-webkit-scrollbar-thumb:hover{background:#4a6266}
::-webkit-scrollbar-corner{background:#111a1c}
a{color:#a5dcdd}a:hover{color:#d4f0f0}
.pcmt-loader{--radius:78px;--speed:2.4s;position:relative;width:calc(var(--radius)*2 + 60px);height:calc(var(--radius)*2 + 60px)}
.pcmt-loader span{position:absolute;left:50%;top:50%;width:34px;height:48px;margin:-24px 0 0 -17px;border-radius:5px;background:url("assets/38f3fa3227d68bf879b50c6927b7ab1f.png") center/90% no-repeat,#000;border:1.5px solid #a5dcdd;box-shadow:0 2px 6px rgba(0,0,0,.35);animation:pcmt-card-splay var(--speed) cubic-bezier(.65,0,.35,1) infinite;animation-delay:calc(var(--i)*0.035s)}
@keyframes pcmt-card-splay{0%,8%{transform:rotate(0deg) translateY(0)}40%,58%{transform:rotate(calc(var(--i)*24deg)) translateY(calc(var(--radius)*-1))}92%,100%{transform:rotate(360deg) translateY(0)}}
@media (prefers-reduced-motion: reduce){.pcmt-loader span{animation-duration:calc(var(--speed)*3)}}
.pcmt-loading{transition:opacity .4s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:#a5dcdd !important;box-shadow:0 0 0 3px rgba(165,220,221,.3)}
a.hm-tile{color:inherit}
.hm-hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:28px;align-items:start}
@media (max-width:860px){.hm-hero{grid-template-columns:1fr}}
.hm-panel{background:#172124;border:1px solid #2a3a3e;border-radius:12px;padding:20px}
.hm-cc textarea{display:block;width:100%;box-sizing:border-box;min-height:150px;resize:vertical;padding:12px 14px;border-radius:8px;border:1px solid #3a4f53;background:#0d1416;color:#eaf4f4;font:16px/1.55 'Space Grotesk',system-ui,sans-serif}
.hm-cc button{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid #a5dcdd;background:#a5dcdd;color:#000;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600}
#comments{scroll-margin-top:24px}
.hm-cc button:disabled{opacity:.45;cursor:not-allowed}
.hm-cc button:focus-visible{outline:2px solid #a5dcdd;outline-offset:2px}
.hm-menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px}
.hm-tile{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:12px;background:#172124;border:1px solid #2a3a3e;text-decoration:none;transition:border-color .15s ease,transform .15s ease}
.hm-tile:hover,.hm-tile:focus-visible{border-color:#a5dcdd;transform:translateY(-2px)}
.hm-tile:focus-visible{outline:2px solid #a5dcdd;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.hm-tile{transition:none}}
.hm-champ-stamp{margin-left:auto;display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:4px;border:1.5px solid #f5d76e;box-shadow:inset 0 0 0 2px #172124,inset 0 0 0 3px #f5d76e,0 0 12px rgba(245,215,110,.45);color:#f5d76e;transform:rotate(-7deg);font:700 10px/1 'JetBrains Mono',monospace;letter-spacing:.16em;white-space:nowrap}
.hm-champ-shine{background-image:linear-gradient(100deg,#f5d76e 0%,#f5d76e 35%,#fff 50%,#f5d76e 65%,#f5d76e 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hm-champ-shine 6s ease-in-out infinite}
@keyframes hm-champ-shine{0%{background-position:160% 0}50%,100%{background-position:-60% 0}}
.hm-champ-sheen{position:absolute;inset:0;z-index:4;pointer-events:none;background-image:linear-gradient(115deg,transparent 42%,rgba(245,215,110,.22) 50%,transparent 58%);background-size:260% 100%;background-repeat:no-repeat;animation:hm-champ-sheen 5s ease-in-out infinite}
@keyframes hm-champ-sheen{0%{background-position:160% 0}55%,100%{background-position:-60% 0}}
.hm-cb{position:relative;overflow:hidden;border-radius:18px;padding:34px 36px 30px;background:radial-gradient(120% 140% at 12% 20%,rgba(255,127,102,.30),transparent 55%),radial-gradient(90% 120% at 100% 100%,rgba(245,215,110,.18),transparent 60%),linear-gradient(135deg,#1d1512 0%,#120d0c 45%,#0b0f10 100%);border:1px solid rgba(245,215,110,.55);box-shadow:0 0 0 2px #0d1416,0 0 0 4px rgba(245,215,110,.75),0 0 40px rgba(245,215,110,.35),0 18px 50px rgba(0,0,0,.5);color:#fff4ea}
.hm-cb-rays{position:absolute;left:-10%;top:-60%;width:70%;aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(245,215,110,.10) 0deg 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0 30%,transparent 70%);mask:radial-gradient(circle,#000 0 30%,transparent 70%);animation:hm-cb-spin 60s linear infinite;pointer-events:none}
@keyframes hm-cb-spin{to{transform:rotate(360deg)}}
.hm-cb-confetti{position:absolute;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(circle,#f5d76e 0 1.5px,transparent 2px),radial-gradient(circle,#ff7f66 0 1.5px,transparent 2px),radial-gradient(circle,#fff 0 1px,transparent 1.5px);background-size:120px 90px,170px 130px,90px 70px;background-position:10px 20px,60px 50px,30px 5px;-webkit-mask:linear-gradient(90deg,transparent 0,#000 35%,#000 100%);mask:linear-gradient(90deg,transparent 0,#000 35%,#000 100%)}
.hm-cb-trophy-art{position:absolute;right:-30px;top:50%;height:150%;width:auto;transform:translateY(-50%) rotate(8deg);opacity:.16;pointer-events:none}
.hm-cb-sheen{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(115deg,transparent 42%,rgba(245,215,110,.16) 50%,transparent 58%);background-size:260% 100%;background-repeat:no-repeat;animation:hm-champ-sheen 7s ease-in-out infinite}
.hm-cb-in{position:relative;display:flex;align-items:center;gap:36px}
.hm-cb-badge{position:relative;flex:none}
.hm-cb-ring{width:190px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#2a1612 0%,#0b0f10 75%);border:3px solid #f5d76e;box-shadow:0 0 0 6px rgba(13,20,22,.9),0 0 0 8px rgba(245,215,110,.45),0 0 50px rgba(255,127,102,.55)}
.hm-cb-ring img{width:72%;height:72%;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.hm-cb-stamp{position:absolute;right:-26px;bottom:6px;margin:0;padding:6px 10px;font-size:12px;box-shadow:inset 0 0 0 2px #120d0c,inset 0 0 0 3px #f5d76e,0 0 16px rgba(245,215,110,.5);background:#120d0c}
.hm-cb-text{display:flex;flex-direction:column;gap:10px;min-width:0}
.hm-cb-kick{display:inline-flex;align-items:center;gap:10px;font:600 13px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:#f5d76e}
.hm-cb-kick img{width:22px;height:22px;object-fit:contain}
.hm-cb-name{margin:0;font-family:'Cabin Sketch',cursive;font-weight:700;font-size:clamp(40px,6vw,76px);line-height:.95;color:#ff7f66;text-shadow:0 3px 0 #5a2418,0 10px 30px rgba(255,127,102,.35)}
.hm-cb-final{margin:4px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:18px;color:#f0dccf}
.hm-cb-final img{width:22px;height:22px;object-fit:contain;vertical-align:-5px}
.hm-cb-score{display:inline-flex;align-items:baseline;gap:6px;font-family:'Cabin Sketch',cursive;font-weight:700;font-size:44px;line-height:1;color:#c9b8ae}
.hm-cb-dash{color:#8a7a72}
.hm-cb-maps{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.hm-cb-maps li{padding:6px 12px;border-radius:999px;border:1px solid rgba(245,215,110,.45);background:rgba(245,215,110,.08);font:600 12px/1 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#f5d76e}
.hm-cb-roster{position:relative;list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.hm-cb-roster li{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;padding:12px 8px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.35));border:1px solid rgba(245,215,110,.35);text-align:center}
.hm-cb-roster li span{font-family:'Cabin Sketch',cursive;font-weight:700;font-size:22px;line-height:1.05;color:#fff4ea;overflow-wrap:anywhere}
.hm-cb-roster li img{width:22px;height:22px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(245,215,110,.7))}
.hm-cb-roster li small{font:600 10px/1.2 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#f5d76e}
.hm-cb-roster li.hm-cb-top{border-color:#f5d76e;box-shadow:0 0 18px rgba(245,215,110,.35);background:linear-gradient(180deg,rgba(245,215,110,.16),rgba(0,0,0,.35))}
@media (max-width:860px){.hm-cb{padding:26px 20px 22px}.hm-cb-in{flex-direction:column;align-items:flex-start;gap:24px}.hm-cb-ring{width:140px}.hm-cb-roster{grid-template-columns:repeat(2,minmax(0,1fr))}.hm-cb-roster li:last-child{grid-column:1 / -1}.hm-cb-trophy-art{height:90%;top:30%;opacity:.12}}

@media (prefers-reduced-motion: reduce){.hm-champ-shine,.hm-champ-sheen{animation:none}}
</style>

    var n = this.ccWords(text);
    if (st.ccBusy || n < 1 || n > 50) return;
    var L = typeof window !== 'undefined' && window.PCMT_LEAGUE;
    this.setState({ ccBusy: true, ccMsg: '', ccOk: false });
    var send = L && L.complain ? L.complain(text) : new Promise(function (res) { setTimeout(res, 600); });   // the canvas just pretends
    send.then(function () { self.setState({ ccBusy: false, ccText: '', ccOk: true, ccMsg: 'Thanks! The PCMT Team reads every one.' }); },
              function (e) { self.setState({ ccBusy: false, ccOk: false, ccMsg: (e && e.message) || 'Couldn\'t send that. Try again.' }); });
  }

  _pageVals() {
    var W = typeof window !== 'undefined' ? window : {};
    var locked = false;   // open to everyone (was admins only)
    var self = this, cc = this.state || {}, ccN = this.ccWords(cc.ccText);
    var live = !!W.PCMT_LEAGUE;
    var teams = {};
    PCMT_ALL_DECK_TEAMS.forEach(function (t) { teams[t.code] = t; });
    var when = function (iso) {
      try {
        var d = new Date(iso);
        return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) + ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
      } catch (e) { return iso; }
    };
    var now = Date.now();
    // Next series: the soonest two that haven't started.
    var all = (live ? (W.PCMT_MATCHES || []) : PCMT_HOME_SAMPLE_MATCHES).slice().sort(function (a, b) { return Date.parse(a.start) - Date.parse(b.start); });
    var upcoming = live ? all.filter(function (m) { return Date.parse(m.start) > now; }) : all;
    var matches = upcoming.slice(0, 2).map(function (m) {
      var ta = teams[m.a] || { name: m.a, color: '#eaf4f4', logo: '' }, tb = teams[m.b] || { name: m.b, color: '#eaf4f4', logo: '' };
      return { a: m.a, b: m.b, aColor: ta.color, bColor: tb.color, aLogo: ta.logo || PCMT_REGION_LOGOS[m.region] || PCMT_REGION_LOGOS.NA, bLogo: tb.logo || PCMT_REGION_LOGOS[m.region] || PCMT_REGION_LOGOS.NA,
               when: when(m.start), meta: (m.region || 'NA') + (m.bo ? ' · Bo' + m.bo : ''),
               url: m.url || 'https://pcmt.gg/matches' };   // each series links to its own page on PCMT.gg
    });
    // Deck lock: 12 hours before the gameweek's first series (gameweeks start Monday 09:00 UTC).
    var d = new Date(now), ws = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 9) - ((d.getUTCDay() + 6) % 7) * 864e5;
    if (ws > now) ws -= 7 * 864e5;
    var inWeek = all.filter(function (m) { var t = Date.parse(m.start); return t >= ws && t < ws + 7 * 864e5; });
    var lockLabel = 'Decks are open';
    if (inWeek.length) {
      var lockAt = Date.parse(inWeek[0].start) - 12 * 36e5;
      var res = live ? (W.PCMT_RESULTS || []) : [];
      var left = inWeek.some(function (m) {   // a game this week still to play (no result yet and its time slot not over)
        var played = res.some(function (r) { return r.start === m.start && r.a === m.a && r.b === m.b; });
        return !played && Date.parse(m.start) + (m.hours || 3) * 36e5 > now;
      });
      lockLabel = now < lockAt ? 'Decks lock ' + when(new Date(lockAt).toISOString()).split(' · ')[0] : left ? 'Decks locked until Monday' : 'Decks are open';
    }
    var results = live ? (W.PCMT_RESULTS || []) : [];
    var last = results.length ? results.slice().sort(function (a, b) { return Date.parse(b.start) - Date.parse(a.start); })[0] : null;
    return {
      locked: locked,
      unlocked: !locked,  // players see nothing of the page until it's opened
      lockHidden: locked ? 'true' : 'false',
      lockBlur: locked ? 'blur(8px)' : 'none',
      lockPointer: locked ? 'none' : 'auto',
      matches: matches, hasMatches: matches.length > 0, noMatches: !matches.length,
      lockLabel: lockLabel,
      hasResult: !!last, resultLabel: last ? last.a + ' vs ' + last.b + ', ' + last.winner + ' won' : '',
      menu: PCMT_HOME_MENU,
      note: PCMT_HOME_NOTE ? Object.assign({}, PCMT_HOME_NOTE, { paras: (PCMT_HOME_NOTE.paras || []).map(function (x) { return { pre: x.pre || '', link: x.link || '', post: x.post || '', hasLink: !!x.link }; }) }) : {},
      hasNote: !!PCMT_HOME_NOTE,
      hasAccount: !!(window.PCMT_AUTH && window.PCMT_AUTH.signedIn),
      ccJump: function (e) {
        var box = document.getElementById('comments'), ta = document.getElementById('cc-text');
        if (!box) return;
        if (e && e.preventDefault) e.preventDefault();
        var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        box.scrollIntoView({ behavior: still ? 'auto' : 'smooth', block: 'start' });
        if (ta) setTimeout(function () { try { ta.focus({ preventScroll: true }); } catch (err) { ta.focus(); } }, still ? 0 : 450);
      },
      ccText: cc.ccText || '',
      ccInput: function (e) { self.setState({ ccText: e && e.target ? e.target.value : '', ccMsg: '' }); },
      ccSend: function () { self.ccSend(); },
      ccCount: ccN + ' / 50 words' + (ccN > 50 ? ' (too many)' : ''),
      ccCountColor: ccN > 50 ? '#ff8a80' : '#93a9aa',
      ccDisabled: ccN < 1 || ccN > 50 || !!cc.ccBusy,
      ccLabel: cc.ccBusy ? 'Sending…' : 'Send',
      ccMsg: cc.ccMsg || '',
      ccMsgColor: cc.ccOk ? '#8be4b7' : '#ff8a80'
    };
  }
}
</script>
