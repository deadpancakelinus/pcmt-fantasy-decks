        ].filter(Boolean).join(', ') || 'none',
        priceLabel: pcmtNum(p.price),
        teamColor: PCMT_TEAMS[p.team],
        regionLogo: PCMT_REGION_LOGOS[pcmtRegions(p)[0]],
        logo: PCMT_LOGOS[p.team] || '',
        hasLogo: !!PCMT_LOGOS[p.team], noLogo: !PCMT_LOGOS[p.team],
        logoH: PCMT_LOGO_H[p.team] || 30,
        teamFull: PCMT_TEAM_NAMES[p.team] || p.team,
        teamFullSize: (PCMT_TEAM_NAMES[p.team] || p.team).length <= 16 ? 11 : 9.5,
        id: p.id,
        isIgl: s.igl === p.id, notIgl: s.igl !== p.id,
        points: pcmtNum(self.weekPoints(p.id)),
        pointsTitle: pcmtNum(self.weekPoints(p.id)) + ' points this gameweek',
        makeIgl: function () { self.setIgl(p.id); },
        removeTap: function () {
          if (self.state.crownArmed || self.state.clearing || self.isLocked()) return;
          if (self._suppressTap && Date.now() - self._suppressTap < 350) return;
          var now = Date.now();
          if (self._lastCardTap && self._lastCardTap.id === p.id && now - self._lastCardTap.t < 400) {
            self._lastCardTap = null;
            self.toggle(p.id);
          } else {
            self._lastCardTap = { id: p.id, t: now };
          }
        },
        remove: function () { self.toggle(p.id); }
      };
    }

    var groups = PCMT_ROLES.map(function (r) {
      var slots = [];
      for (var i = 1; i <= PCMT_PER_ROLE; i++) slots.push(slotView(r.key + '-' + i, r.key, (/^[aeiou]/i.test(r.label) ? 'Buy an ' : 'Buy a ') + r.label.toLowerCase(), 'opens ' + r.label.toUpperCase() + ' page'));
      return { label: r.label, cls: 'pcmt-g2', inner: 'pcmt-in2', filledLabel: roleFilled(r.key) + '/' + PCMT_PER_ROLE, slots: slots };
    });
    var wildSlots = [];
    for (var j = 1; j <= PCMT_WILD; j++) wildSlots.push(slotView('wild-' + j, null, 'Wildcard', 'any role, once its slots are full'));
    groups.push({ label: 'Wildcards', cls: 'pcmt-g3', inner: 'pcmt-in3', filledLabel: wildFilled + '/' + PCMT_WILD, slots: wildSlots });

    var tabs = [{
      label: 'All players', icons: PCMT_ROLES.map(function (r) { return { src: PCMT_ROLE_ICONS[r.key] }; }), count: picked.length + '/' + PCMT_SIZE,
      active: allTab, inactive: !allTab,
      pick: function () { self.setState({ tab: 'all' }); }
    }].concat(PCMT_ROLES.map(function (r) {
      return {
        label: r.label, icons: [{ src: PCMT_ROLE_ICONS[r.key] }], count: roleFilled(r.key) + '/' + PCMT_PER_ROLE,
        active: r.key === tabRole.key, inactive: r.key !== tabRole.key,
        pick: function () { self.setState({ tab: r.key }); }
      };
    }));

    var need = PCMT_SIZE - picked.length;
    var openRole = allTab ? 0 : PCMT_PER_ROLE - roleFilled(tabRole.key);
    var openWild = PCMT_WILD - wildFilled;
    var buyNote;
    if (allTab) buyNote = need > 0 ? need + ' of ' + PCMT_SIZE + ' slots open. Players go into their role first, then a wildcard.' : 'Deck full. Sell a player to buy another.';
    else if (openRole > 0) buyNote = openRole + ' ' + tabRole.label.toLowerCase() + ' slot' + (openRole === 1 ? '' : 's') + ' open.';
    else if (openWild > 0) buyNote = tabRole.label + ' slots are full. A buy here fills a wildcard (' + openWild + ' left).';
    else buyNote = tabRole.label + ' slots and wildcards are full. Sell a player to buy another.';

    var ready = need === 0 && !!iglPlayer && !weekLocked;
    var statusText;
    var missing = PCMT_ROLES.map(function (r) {
      var n = PCMT_PER_ROLE - roleFilled(r.key);
      return n > 0 ? n + ' ' + r.label.toLowerCase() : null;
    }).filter(Boolean);
    var openWildAll = PCMT_WILD - wildFilled;
    if (weekLocked) statusText = 'Gameweek locked. Deck changes reopen ' + pcmtWhen(wk.until) + '.';
    else if (wk.weekDone) statusText = 'This gameweek\'s games are done, so decks are open again. Changes you save now count from next gameweek.';
    else if (s.saved) statusText = 'Deck locked in. Edits are open until ' + (wk.lockAt ? pcmtWhen(wk.lockAt) : 'the next match') + '.';
    else if (missing.length) statusText = 'No points until every role is filled. Still need: ' + missing.join(', ') + '.';
    else if (need > 0) statusText = 'Every role is filled. Pick ' + openWildAll + ' more wildcard' + (openWildAll === 1 ? '' : 's') + ' to complete your deck.';
    else if (!iglPlayer) statusText = 'Click the crown, then pick a card to make your IGL.';
    else statusText = 'Ready to lock in.';

    var teamOptions = [{ key: 'ALL', label: 'All teams' }].concat(PCMT_TEAM_LIST.map(function (t) {
      return { key: t.code, label: t.code + ' · ' + t.name };
    }));

    return {
      pool: pool, groups: groups, tabs: tabs, teamOptions: teamOptions,
      tabCode: allTab ? 'ALL PLAYERS' : tabRole.label.toUpperCase(),
      deck: pcmtDeckTheme(s.deckCode),
      ethanOn: !!s.saved && s.auraKind === 'ethan',
      haloOn: !!s.saved && s.auraKind === 'halo',
      ringOn: !!s.saved && s.auraKind === 'ring',
      prideOn: !!s.saved && s.auraKind === 'pride',
      mistOn: !!s.saved && s.auraKind === 'mist',
      prideA: this._prideTraces || (this._prideTraces = pcmtHaloTraces()),
      ring: this._ringTraces || (this._ringTraces = pcmtHaloTraces()),
      auraEndClass: s.auraEnding ? 'pcmt-aura-end' : '',
      halo: this._haloTraces || (this._haloTraces = pcmtHaloTraces()),
      deckBackBg: (s.saved && s.auraKind === 'ethan') ? pcmtDeckTheme(s.deckCode).plainBg : pcmtDeckTheme(s.deckCode).bg,
      aura: this._auraTraces || (this._auraTraces = pcmtAuraTraces()),
      crownArmed: !!s.crownArmed,
      crownBorder: s.crownArmed ? '#f5d76e' : 'rgba(245,215,110,.5)',
      crownBg: s.crownArmed ? 'rgba(245,215,110,.15)' : 'transparent',
      crownLabel: s.igl ? 'IGL crown. Double-click to take the IGL role off.' : 'IGL crown. Click, then pick the card you want as your IGL.',
      // Click: no IGL yet -> pick a card (click again to cancel). IGL already set -> nothing.
      // Double-click: take the IGL role off.
      crownClick: function () {
        if (weekLocked) return;
        var now = Date.now(), dbl = !!self._crownLast && now - self._crownLast < 400;
        self._crownLast = dbl ? 0 : now;
        if (self.state.igl) {
          if (dbl) { clearTimeout(self._iglFlip); self.setState({ igl: null, saved: false, crownArmed: false, iglFlip: null }); }
          return;
        }
        if (!dbl) self.setState({ crownArmed: !self.state.crownArmed });
      },
      squadName: s.squadName || '',
      hasSquadName: !!(s.squadName || '').trim(),
      noSquadName: !(s.squadName || '').trim(),
      setSquadName: function (e) {
        var v = e && e.target ? e.target.value : '';
        if (pcmtCensorName(v).bad) {   // blocked words: keep the old name and say why
          if (e && e.target) e.target.value = self.state.squadName || '';
          self.setState({ nameError: 'That deck name isn\'t allowed. Pick another one.' });
          return;
        }
        self.setState({ squadName: v, nameError: '' });
      },
      nameError: s.nameError || '', hasNameError: !!s.nameError,
      matchTime: pcmtMatchTime(PCMT_NEXT_MATCH),
      nextMatches: ['NA', 'EMEA'].map(function (region) {
        var now = Date.now();
        var next = PCMT_MATCHES.filter(function (x) { return x.region === region && Date.parse(x.start) + x.hours * 3600000 > now; })
          .sort(function (x, y) { return Date.parse(x.start) - Date.parse(y.start); })[0];
        if (!next) return { region: region, regionLogo: PCMT_REGION_LOGOS[region], has: false, none: true };
        return { region: region, regionLogo: PCMT_REGION_LOGOS[region], has: true, none: false, url: next.url, a: next.a, b: next.b, bo: next.bo,
          colorA: PCMT_TEAMS[next.a] || '#eaf4f4', colorB: PCMT_TEAMS[next.b] || '#eaf4f4', time: pcmtMatchTime(next.start) };
      }),
      weekLocked: weekLocked, weekOpen: !weekLocked,
      lockNote: weekLocked ? 'Locked until ' + pcmtWhen(wk.until) : '',
      showCountdown: !weekLocked && !!nextLock,
      countdown: nextLock ? pcmtCountdown(nextLock - Date.now()) : '',
      countdownTitle: nextLock ? 'Decks lock ' + pcmtWhen(nextLock) + ' (12 hours before the first match of the week)' : '',
      lockTitle: weekLocked ? 'Deck locked' : 'Deck open for changes',
      actionsDisabled: weekLocked,
      actionOpacity: weekLocked ? 0.4 : 1,
      lockColor: weekLocked ? '#ff7f66' : '#93a9aa',
      lockPath: weekLocked ? 'M8 11V7a4 4 0 0 1 8 0v4' : 'M8 11V7a4 4 0 0 1 7.5-2',
      mvpLabel: (pickedIds.indexOf(mvpId) >= 0 && self.find(mvpId)) ? 'Your MVP · Week ' + (this.props.mvpWeek ?? 1) : 'Your MVP',
      mvpName: (pickedIds.indexOf(mvpId) >= 0 && self.find(mvpId)) ? self.find(mvpId).name : '—',
      mvpHasLogo: !!(pickedIds.indexOf(mvpId) >= 0 && self.find(mvpId) && PCMT_LOGOS[self.find(mvpId).team]),
      mvpLogo: (self.find(mvpId) && PCMT_LOGOS[self.find(mvpId).team]) || '',
      mvpTeam: self.find(mvpId) ? self.find(mvpId).team : '',
      mvpLogoH: self.find(mvpId) ? Math.round((PCMT_LOGO_H[self.find(mvpId).team] || 30) * 1.3) : 39,
      buyNote: buyNote,
      filter: s.filter,
      poolCount: pool.length, poolWord: pool.length === 1 ? 'player' : 'players', poolWordUp: pool.length === 1 ? 'PLAYER' : 'PLAYERS',
      search: s.search || '',
      auraOn: (function () {
        var m = self.props.auraPreview ?? 'Live';
        if (m === 'On') return true;
        if (m === 'Off') return false;
        return !!PCMT_AURA.holderId && PCMT_AURA.holderId === PCMT_AURA.me;
      })(),
      noResults: pool.length === 0,
      noResultsText: (s.regions && !s.regions.NA && !s.regions.EMEA) ? 'Turn on NA or EMEA to see players.' : 'No players match that search.',
      naOn: !(s.regions && s.regions.NA === false), emeaOn: !(s.regions && s.regions.EMEA === false),
      naBorder: (s.regions && s.regions.NA === false) ? '#3a4f53' : '#a5dcdd',
      naBg: (s.regions && s.regions.NA === false) ? 'transparent' : '#13292b',
      naColor: (s.regions && s.regions.NA === false) ? '#93a9aa' : '#a5dcdd',
      emeaBorder: (s.regions && s.regions.EMEA === false) ? '#3a4f53' : '#a5dcdd',
      emeaBg: (s.regions && s.regions.EMEA === false) ? 'transparent' : '#13292b',
      emeaColor: (s.regions && s.regions.EMEA === false) ? '#93a9aa' : '#a5dcdd',
      regionNA: PCMT_REGION_LOGOS.NA, regionEMEA: PCMT_REGION_LOGOS.EMEA,
      naImgOpacity: (s.regions && s.regions.NA === false) ? 0.35 : 1, naImgFilter: (s.regions && s.regions.NA === false) ? 'grayscale(1)' : 'none',
      emeaImgOpacity: (s.regions && s.regions.EMEA === false) ? 0.35 : 1, emeaImgFilter: (s.regions && s.regions.EMEA === false) ? 'grayscale(1)' : 'none',
      dealNaOn: !(s.dealRegions && s.dealRegions.NA === false), dealEmeaOn: !(s.dealRegions && s.dealRegions.EMEA === false),
      dealNaBorder: (s.dealRegions && s.dealRegions.NA === false) ? '#3a4f53' : '#d4af37',
      dealNaBg: (s.dealRegions && s.dealRegions.NA === false) ? 'transparent' : 'rgba(212,175,55,.12)',
      dealNaColor: (s.dealRegions && s.dealRegions.NA === false) ? '#93a9aa' : '#f5d76e',
      dealNaImgOpacity: (s.dealRegions && s.dealRegions.NA === false) ? 0.35 : 1, dealNaImgFilter: (s.dealRegions && s.dealRegions.NA === false) ? 'grayscale(1)' : 'none',
      dealEmeaBorder: (s.dealRegions && s.dealRegions.EMEA === false) ? '#3a4f53' : '#d4af37',
      dealEmeaBg: (s.dealRegions && s.dealRegions.EMEA === false) ? 'transparent' : 'rgba(212,175,55,.12)',
      dealEmeaColor: (s.dealRegions && s.dealRegions.EMEA === false) ? '#93a9aa' : '#f5d76e',
      dealEmeaImgOpacity: (s.dealRegions && s.dealRegions.EMEA === false) ? 0.35 : 1, dealEmeaImgFilter: (s.dealRegions && s.dealRegions.EMEA === false) ? 'grayscale(1)' : 'none',
      dealToggleNA: function () { self.toggleDealRegion('NA'); },
      dealToggleEMEA: function () { self.toggleDealRegion('EMEA'); },
      dealDisabled: weekLocked || !!(s.dealRegions && s.dealRegions.NA === false && s.dealRegions.EMEA === false),
      dealOpacity: (weekLocked || (s.dealRegions && s.dealRegions.NA === false && s.dealRegions.EMEA === false)) ? 0.4 : 1,
      toggleNA: function () { self.toggleRegion('NA'); },
      toggleEMEA: function () { self.toggleRegion('EMEA'); },
      setSearch: function (e) { self.setState({ search: e && e.target ? e.target.value : '' }); },
      pickTeam: function (e) { self.setState({ filter: e && e.target ? e.target.value : 'ALL' }); },
      spentLabel: pcmtNum(spent),
      leftLabel: pcmtNum(left),
      budgetLabel: pcmtNum(budget),
      spentPct: Math.min(100, Math.round((spent / budget) * 100)),
      countLabel: picked.length + '/' + PCMT_SIZE,
      teamLimit: teamLimit,
      iglName: iglPlayer ? iglPlayer.name : '—',
      statusText: window.PCMT_LEAGUE ? window.PCMT_LEAGUE.statusNote(s.slots, statusText, weekLocked) : statusText,
      storeOpen: s.storeOpen !== false, storeClosed: s.storeOpen === false,
      toggleStore: function () { var open = self.state.storeOpen === false; try { window.localStorage.setItem('pcmt-store-open', open ? '1' : '0'); } catch (e) {} self.setState({ storeOpen: open }); },
      ready: ready && !s.saved, notReady: !(ready && !s.saved),
      save: function () {
        if (weekLocked) return;
        if (window.PCMT_LEAGUE && !window.PCMT_LEAGUE.canLockIn(self.state)) return;
        self.setState({ saved: true, stackNeat: true });
        try {
          var h = document.getElementById('squad-h');
          var sec = h && h.closest('section');
          if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (e) {}
        clearTimeout(self._flipStart); clearTimeout(self._flipEnd); clearTimeout(self._iglFlip);
        self.setState({ lockAnim: false, iglFlip: null, tilt: null });
        self._flipStart = setTimeout(function () {
          self.setState({ lockAnim: true });
          self._flipEnd = setTimeout(function () { self.setState({ lockAnim: false }); }, 2400);
        }, 450);
      },
      stackClass: s.stackPulse ? 'pcmt-stack-pulse' : '',
      stackGlow: (s.drag && s.drag.over) ? '0 0 0 2px ' + pcmtDeckTheme(s.deckCode).color + ', 0 0 28px ' + pcmtDeckTheme(s.deckCode).glow : 'none',
      stackExtras: (s.stackExtras || []).map(function (x, i) { return s.stackNeat ? { rz: 0, jx: 0, jy: -Math.min(i + 1, 6), z: 5 + i } : { rz: x.rz, jx: x.jx, jy: x.jy, z: 5 + i }; }),
      stackT1: s.stackNeat ? 'translate(3px, 3px)' : (s.stackMess ? s.stackMess[0] : 'translate(10px, 10px) rotate(4deg)'),
      stackT2: s.stackNeat ? 'translate(2px, 2px)' : (s.stackMess ? s.stackMess[1] : 'translate(6px, 5px) rotate(-3deg)'),
      stackT3: s.stackNeat ? 'translate(1px, 1px)' : (s.stackMess ? s.stackMess[2] : 'translate(2px, 2px) rotate(1.5deg)'),
      stackRight: function (e) {
        if (e && e.preventDefault) e.preventDefault();
        if (self.state.clearing) return;
        var now = Date.now();
        if (self._lastStackRight && now - self._lastStackRight < 450) {
          self._lastStackRight = 0;
          function r(n) { return Math.round((Math.random() * 2 - 1) * n * 10) / 10; }
          var mess = [0, 1, 2].map(function () { return 'translate(' + r(14) + 'px, ' + r(12) + 'px) rotate(' + r(13) + 'deg)'; });
          var ex = (self.state.stackExtras || []).map(function () { return { jx: Math.round(r(16)), jy: Math.round(r(12)), rz: r(15) }; });
          self.setState({ stackNeat: false, stackMess: mess, stackExtras: ex });
        } else {
          self._lastStackRight = now;
        }
      },
      stackTap: function () {
        if (self.state.clearing) return;
        var now = Date.now();
        if (self._lastStackTap && now - self._lastStackTap < 400) { self._lastStackTap = 0; self.setState({ stackNeat: true }); }
        else self._lastStackTap = now;
      },
      clearLabel: s.clearArmed ? 'Tap again to clear' : 'Clear deck',
      clearBorder: s.clearArmed ? '#ff7f66' : '#3a4f53',
      clearColor: s.clearArmed ? '#ff7f66' : '#93a9aa',
      dealJohn: function () {
        if (self.isLocked()) return;
        var squad = self.johnSquad(budget, teamLimit);
        if (!squad) return;
        self.replayDeal(squad);
        var has = Object.keys(squad.slots).some(function (k) { return squad.slots[k] === 'longclaw'; });
        if (has) self.setState({ blessedId: 'longclaw' });
      },
      dealGlue: function () {
        var squad = self.glueSquad(budget, teamLimit);
        if (!squad) return;
        self.replayDeal(squad);
      },
      dealMajority: function () {
        if (self.isLocked()) return;
        var squad = self.majoritySquad(budget, teamLimit);
        if (!squad) return;
        self.replayDeal(squad);
      },
      dealBren: function () {
        var squad = self.randomSquad(budget, teamLimit);
        if (!squad) return;
        self.replayDeal(squad);
      },
      reset: function () {
        clearTimeout(self._clearTimer);
        if (self.state.clearArmed) {
          if (self.state.saved && self.state.auraKind && !self.isLocked()) {
            self.setState({ auraEnding: true, clearArmed: false });
            self._clearTimer = setTimeout(function () {
              self.setState({ auraEnding: false, saved: false });
              self.foldIntoStack();
            }, 800);
          } else {
            self.foldIntoStack();
          }
        } else {
          self.setState({ clearArmed: true });
          self._clearTimer = setTimeout(function () { self.setState({ clearArmed: false }); }, 1500);
        }
      }
    };
  }
}
</script>
